<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppCenterStudioGYM - Dashboard Fornitore</title>
    <style>
        :root {
            --nero: #1A1A1A;
            --tortora: #9C928A;
            --tortora-scuro: #7A716A;
            --tortora-chiaro: #E8E3DE;
            --tortora-chiarissimo: #F5F2EF;
            --bianco: #FFFFFF;
            --verde: #27AE60;
            --verde-chiaro: #D5F5E3;
            --arancione: #F39C12;
            --arancione-chiaro: #FDEBD0;
            --rosso: #E74C3C;
            --rosso-chiaro: #FADBD8;
            --ombra: 0 2px 12px rgba(156, 146, 138, 0.15);
            --ombra-forte: 0 4px 20px rgba(156, 146, 138, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: radial-gradient(circle at center, #FFFFFF 0%, #F5F2EF 40%, #E8E3DE 100%);
            color: var(--nero);
            min-height: 100vh;
        }
        
        /* HEADER */
        .header {
            background-color: var(--bianco);
            border-bottom: 2px solid var(--tortora);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 22px;
            color: var(--nero);
            font-weight: 600;
        }
        .header .user-info {
            font-size: 14px;
            color: var(--tortora);
        }
        .btn-logout {
            padding: 8px 20px;
            background-color: var(--bianco);
            color: var(--tortora);
            border: 1px solid var(--tortora);
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-logout:hover {
            background-color: var(--tortora);
            color: var(--bianco);
        }
        
        /* CONTAINER */
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }
        
        /* WELCOME CARD */
        .welcome-card {
            background-color: var(--bianco);
            border: 2px solid var(--tortora);
            border-radius: 8px;
            padding: 25px 30px;
            margin-bottom: 25px;
            box-shadow: var(--ombra);
        }
        .welcome-card h2 {
            font-size: 20px;
            color: var(--nero);
            margin-bottom: 8px;
        }
        .welcome-card p {
            color: var(--tortora);
            font-size: 14px;
        }
        
        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background-color: var(--bianco);
            border: 2px solid var(--tortora-chiaro);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            box-shadow: var(--ombra);
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--ombra-forte);
        }
        .stat-card .number {
            font-size: 36px;
            font-weight: 700;
            color: var(--nero);
            margin-bottom: 8px;
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--tortora);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .stat-card.verde { border-left: 5px solid var(--verde); }
        .stat-card.arancione { border-left: 5px solid var(--arancione); }
        .stat-card.rosso { border-left: 5px solid var(--rosso); }
        
        /* SECTION TITLE */
        .section-title {
            font-size: 18px;
            color: var(--nero);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--tortora);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* PALESTRE LIST */
        .palestre-list {
            background-color: var(--bianco);
            border: 2px solid var(--tortora);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--ombra);
        }
        .palestra-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 15px;
            border-bottom: 1px solid var(--tortora-chiaro);
            transition: background 0.2s;
        }
        .palestra-item:last-child { border-bottom: none; }
        .palestra-item:hover { background: var(--tortora-chiarissimo); }
        
        .palestra-info {
            flex: 1;
        }
        .palestra-info .name {
            font-size: 16px;
            color: var(--nero);
            font-weight: 600;
            margin-bottom: 4px;
        }
        .palestra-info .details {
            font-size: 13px;
            color: var(--tortora);
        }
        
        /* STATUS INDICATOR */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 15px;
        }
        .status-verde {
            background: var(--verde-chiaro);
            color: #1E8449;
            border: 1px solid var(--verde);
        }
        .status-arancione {
            background: var(--arancione-chiaro);
            color: #9C640C;
            border: 1px solid var(--arancione);
            animation: pulse 2s infinite;
        }
        .status-rosso {
            background: var(--rosso-chiaro);
            color: #922B21;
            border: 1px solid var(--rosso);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-verde { background: var(--verde); }
        .dot-arancione { background: var(--arancione); }
        .dot-rosso { background: var(--rosso); }
        
        /* ACTIONS */
        .palestra-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-action {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-attiva {
            background: var(--verde);
            color: var(--bianco);
        }
        .btn-attiva:hover { background: #1E8449; }
        .btn-spegni {
            background: var(--rosso);
            color: var(--bianco);
        }
        .btn-spegni:hover { background: #922B21; }
        .btn-offerte {
            background: var(--tortora);
            color: var(--bianco);
            text-decoration: none;
        }
        .btn-offerte:hover { background: var(--nero); }
        
        /* COUNTDOWN */
        .countdown {
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }
        .countdown-verde { color: var(--verde); }
        .countdown-arancione { color: var(--arancione); }
        .countdown-rosso { color: var(--rosso); }
        
        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--tortora);
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        /* ALERT BANNER */
        .alert-banner {
            background: var(--arancione-chiaro);
            border: 2px solid var(--arancione);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #9C640C;
            font-weight: 600;
        }
        .alert-banner .icon {
            font-size: 20px;
        }
        .alert-banner.rosso {
            background: var(--rosso-chiaro);
            border-color: var(--rosso);
            color: #922B21;
        }
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 15px; padding: 20px; }
            .palestra-item { flex-direction: column; align-items: flex-start; gap: 12px; }
            .palestra-actions { width: 100%; justify-content: flex-end; }
            .status-indicator { margin-right: 0; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AppCenterStudioGIM</h1>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span class="user-info">Fornitore</span>
            <a href="index.html" class="btn-logout">Esci</a>
        </div>
    </div>
    
    <div class="container">
        <div class="welcome-card">
            <h2>Benvenuto, AppCenterStudioGIM</h2>
            <p>Dashboard di gestione fornitori - Gestione Palestre</p>
        </div>
        
        <!-- ALERT BANNER (appare solo se ci sono palestre in scadenza) -->
        <div id="alertContainer"></div>
        
        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card verde">
                <div class="number" id="statAttive">0</div>
                <div class="label">Palestre Attive</div>
            </div>
            <div class="stat-card arancione">
                <div class="number" id="statInScadenza">0</div>
                <div class="label">In Scadenza (30gg)</div>
            </div>
            <div class="stat-card rosso">
                <div class="number" id="statScadute">0</div>
                <div class="label">Scadute</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statTotale">0</div>
                <div class="label">Totale Palestre</div>
            </div>
        </div>
        
        <!-- PALESTRE LIST -->
        <h3 class="section-title">🏋️ Stato Palestre</h3>
        <div class="palestre-list" id="palestreList">
            <div class="empty-state">
                <div class="icon">🏋️</div>
                <div>Nessuna palestra registrata</div>
            </div>
        </div>
    </div>

    <script>
    // ============================================================
    // CONFIGURAZIONE
    // ============================================================
    const TRIAL_DAYS = 30;
    const ALERT_DAYS = 30; // Allerta 30 giorni prima
    
    // ============================================================
    // DATI
    // ============================================================
    let palestre = JSON.parse(localStorage.getItem('palestre') || '[]');
    
    // ============================================================
    // INIZIALIZZAZIONE
    // ============================================================
    function init() {
        aggiornaStati();
        renderStats();
        renderAlerts();
        renderPalestre();
    }
    
    // ============================================================
    // AGGIORNA STATI (controlla scadenze)
    // ============================================================
    function aggiornaStati() {
        const oggi = new Date();
        palestre.forEach(palestra => {
            if (!palestra.stato) palestra.stato = 'prova';
            
            const scadenza = new Date(palestra.dataScadenza);
            const giorniRimanenti = Math.ceil((scadenza - oggi) / (1000 * 60 * 60 * 24));
            
            if (palestra.stato === 'attiva') {
                // Se è attiva manualmente, resta attiva
                palestra.giorniRimanenti = giorniRimanenti;
            } else if (giorniRimanenti < 0) {
                palestra.stato = 'scaduta';
                palestra.giorniRimanenti = giorniRimanenti;
            } else {
                palestra.stato = 'prova';
                palestra.giorniRimanenti = giorniRimanenti;
            }
        });
        savePalestre();
    }
    
    // ============================================================
    // RENDER STATS
    // ============================================================
    function renderStats() {
        const attive = palestre.filter(p => p.stato === 'attiva').length;
        const inScadenza = palestre.filter(p => 
            p.stato === 'prova' && p.giorniRimanenti <= ALERT_DAYS && p.giorniRimanenti >= 0
        ).length;
        const scadute = palestre.filter(p => p.stato === 'scaduta').length;
        
        document.getElementById('statAttive').textContent = attive;
        document.getElementById('statInScadenza').textContent = inScadenza;
        document.getElementById('statScadute').textContent = scadute;
        document.getElementById('statTotale').textContent = palestre.length;
    }
    
    // ============================================================
    // RENDER ALERTS
    // ============================================================
    function renderAlerts() {
        const container = document.getElementById('alertContainer');
        const inScadenza = palestre.filter(p => 
            p.stato === 'prova' && p.giorniRimanenti <= ALERT_DAYS && p.giorniRimanenti >= 0
        );
        const scadute = palestre.filter(p => p.stato === 'scaduta');
        
        let html = '';
        
        if (scadute.length > 0) {
            html += `
                <div class="alert-banner rosso">
                    <span class="icon">🚨</span>
                    <span><strong>${scadute.length}</strong> palestr${scadute.length === 1 ? 'a è' : 'e sono'} SCADUT${scadute.length === 1 ? 'A' : 'E'}! Invia subito il rinnovo.</span>
                </div>
            `;
        }
        
        if (inScadenza.length > 0) {
            html += `
                <div class="alert-banner">
                    <span class="icon">⚠️</span>
                    <span><strong>${inScadenza.length}</strong> palestr${inScadenza.length === 1 ? 'a sta' : 'e stanno'} per scadere entro 30 giorni. Invia l'offerta di rinnovo!</span>
                </div>
            `;
        }
        
        container.innerHTML = html;
    }
    
    // ============================================================
    // RENDER PALESTRE
    // ============================================================
    function renderPalestre() {
        const container = document.getElementById('palestreList');
        
        if (palestre.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">🏋️</div>
                    <div>Nessuna palestra registrata. Vai su "Offerte" per aggiungerne una.</div>
                </div>
            `;
            return;
        }
        
        // Ordina: prima le scadute, poi in scadenza, poi attive
        const palestreOrdinate = [...palestre].sort((a, b) => {
            if (a.stato === 'scaduta' && b.stato !== 'scaduta') return -1;
            if (a.stato !== 'scaduta' && b.stato === 'scaduta') return 1;
            if (a.stato === 'prova' && b.stato === 'attiva') return -1;
            if (a.stato === 'attiva' && b.stato === 'prova') return 1;
            return (a.giorniRimanenti || 0) - (b.giorniRimanenti || 0);
        });
        
        let html = '';
        palestreOrdinate.forEach(palestra => {
            let statusClass = 'status-verde';
            let dotClass = 'dot-verde';
            let statusText = 'Attiva';
            let countdownClass = 'countdown-verde';
            let countdownText = '';
            let btnToggleClass = 'btn-spegni';
            let btnToggleText = '⏸️ Spegni';
            let btnToggleTitle = 'Disattiva palestra';
            
            if (palestra.stato === 'scaduta') {
                statusClass = 'status-rosso';
                dotClass = 'dot-rosso';
                statusText = 'Scaduta';
                countdownClass = 'countdown-rosso';
                countdownText = `Scaduta da ${Math.abs(palestra.giorniRimanenti)} giorni`;
                btnToggleClass = 'btn-attiva';
                btnToggleText = '✓ Riattiva';
                btnToggleTitle = 'Riattiva dopo pagamento';
            } else if (palestra.stato === 'prova' && palestra.giorniRimanenti <= ALERT_DAYS) {
                statusClass = 'status-arancione';
                dotClass = 'dot-arancione';
                statusText = 'In Scadenza';
                countdownClass = 'countdown-arancione';
                countdownText = `Scade tra ${palestra.giorniRimanenti} giorni`;
                btnToggleClass = 'btn-attiva';
                btnToggleText = '✓ Attiva';
                btnToggleTitle = 'Attiva manualmente';
            } else if (palestra.stato === 'prova') {
                statusClass = 'status-verde';
                dotClass = 'dot-verde';
                statusText = 'In Prova';
                countdownClass = 'countdown-verde';
                countdownText = `Prova: ${palestra.giorniRimanenti} giorni rimanenti`;
                btnToggleClass = 'btn-spegni';
                btnToggleText = '⏸️ Spegni';
                btnToggleTitle = 'Disattiva palestra';
            } else {
                // Attiva manualmente
                countdownText = 'Abbonamento attivo';
                btnToggleClass = 'btn-spegni';
                btnToggleText = '️ Spegni';
                btnToggleTitle = 'Disattiva palestra';
            }
            
            const scadenza = new Date(palestra.dataScadenza).toLocaleDateString('it-IT');
            
            html += `
                <div class="palestra-item">
                    <div class="palestra-info">
                        <div class="name">${palestra.nome}</div>
                        <div class="details">
                            ${palestra.referente || 'Nessun referente'} • ${palestra.citta || 'Città non specificata'}<br>
                            📞 ${palestra.telefono} • Scadenza: ${scadenza}
                        </div>
                        <div class="countdown ${countdownClass}">${countdownText}</div>
                    </div>
                    
                    <div class="status-indicator ${statusClass}">
                        <span class="status-dot ${dotClass}"></span>
                        ${statusText}
                    </div>
                    
                    <div class="palestra-actions">
                        <a href="offerte.html" class="btn-action btn-offerte">📋 Offerte</a>
                        <button class="btn-action ${btnToggleClass}" onclick="togglePalestra(${palestra.id})" title="${btnToggleTitle}">
                            ${btnToggleText}
                        </button>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }
    
    // ============================================================
    // TOGGLE PALESTRA (Attiva/Spegni)
    // ============================================================
    function togglePalestra(id) {
        const palestra = palestre.find(p => p.id === id);
        if (!palestra) return;
        
        if (palestra.stato === 'attiva') {
            // Spegni
            palestra.stato = 'prova';
            showToast(`⏸️ ${palestra.nome} disattivata`);
        } else {
            // Attiva
            palestra.stato = 'attiva';
            // Estendi scadenza di 30 giorni dall'oggi
            const oggi = new Date();
            const nuovaScadenza = new Date(oggi);
            nuovaScadenza.setDate(nuovaScadenza.getDate() + 30);
            palestra.dataScadenza = nuovaScadenza.toISOString();
            showToast(`✅ ${palestra.nome} attivata per 30 giorni`);
        }
        
        savePalestre();
        aggiornaStati();
        renderStats();
        renderAlerts();
        renderPalestre();
    }
    
    // ============================================================
    // UTILITIES
    // ============================================================
    function savePalestre() {
        localStorage.setItem('palestre', JSON.stringify(palestre));
    }
    
    function showToast(message) {
        const toast = document.createElement('div');
        toast.style.cssText = `
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--nero);
            color: var(--bianco);
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: var(--ombra-forte);
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
        `;
        toast.textContent = message;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';
        }, 10);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(20px)';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
    
    // Avvia
    init();
    </script>
</body>
</html>
