<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppCenterStudioGYM - Dashboard Fornitore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: radial-gradient(circle at center, #FFFFFF 0%, #F5F2EF 40%, #E8E3DE 100%);
            color: #1A1A1A;
            min-height: 100vh;
        }
        .header {
            background-color: #FFFFFF;
            border-bottom: 2px solid #9C928A;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 22px;
            color: #1A1A1A;
            font-weight: 600;
        }
        .header .user-info {
            font-size: 14px;
            color: #9C928A;
        }
        .btn-logout {
            padding: 8px 20px;
            background-color: #9C928A;
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
        }
        .btn-logout:hover {
            background-color: #1A1A1A;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .welcome-card {
            background-color: #FFFFFF;
            border: 2px solid #9C928A;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .welcome-card h2 {
            font-size: 20px;
            color: #1A1A1A;
            margin-bottom: 10px;
        }
        .welcome-card p {
            color: #9C928A;
            font-size: 14px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background-color: #FFFFFF;
            border: 2px solid #9C928A;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 36px;
            font-weight: 600;
            color: #1A1A1A;
        }
        .stat-card .label {
            font-size: 13px;
            color: #9C928A;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-title {
            font-size: 18px;
            color: #1A1A1A;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #9C928A;
        }
        .palestre-list {
            background-color: #FFFFFF;
            border: 2px solid #9C928A;
            border-radius: 8px;
            padding: 20px;
        }
        .palestra-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #E8E3DE;
        }
        .palestra-item:last-child {
            border-bottom: none;
        }
        .palestra-item .name {
            font-size: 15px;
            color: #1A1A1A;
            font-weight: 500;
        }
        .palestra-item .status {
            font-size: 13px;
            color: #9C928A;
        }
        .btn-add {
            display: inline-block;
            padding: 12px 24px;
            background-color: #9C928A;
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            text-decoration: none;
        }
        .btn-add:hover {
            background-color: #1A1A1A;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AppCenterStudioGIM</h1>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span class="user-info">Fornitore</span>
            <a href="index.html" class="btn-logout">Esci</a>
        </div>
    </div>
    <div class="container">
        <div class="welcome-card">
            <h2>Benvenuto, AppCenterStudioGIM</h2>
            <p>Dashboard di gestione fornitori - Gestione Palestre</p>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number">0</div>
                <div class="label">Palestre Attive</div>
            </div>
            <div class="stat-card">
                <div class="number">0</div>
                <div class="label">Atleti Totali</div>
            </div>
            <div class="stat-card">
                <div class="number">0</div>
                <div class="label">Abbonamenti Attivi</div>
            </div>
            <div class="stat-card">
                <div class="number">€ 0</div>
                <div class="label">Incassi Mese</div>
            </div>
        </div>
        <h3 class="section-title">Palestre Registrate</h3>
        <a href="#" class="btn-add">+ Aggiungi Nuova Palestra</a>
        <div class="palestre-list">
            <div class="palestra-item">
                <span class="name">Nessuna palestra registrata</span>
                <span class="status">In attesa di attivazione</span>
            </div>
        </div>
    </div>
</body>
</html>
