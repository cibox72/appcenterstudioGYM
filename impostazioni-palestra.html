<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impostazioni Palestra - AppCenterStudioGYM</title>
    <style>
        :root { --nero: #1A1A1A; --tortora: #9C928A; --tortora-scuro: #7A716A; --tortora-chiaro: #E8E3DE; --tortora-chiarissimo: #F5F2EF; --bianco: #FFFFFF; --verde: #27AE60; --rosso: #E74C3C; --blu: #3498DB; --ombra: 0 2px 12px rgba(0,0,0,0.08); --ombra-forte: 0 8px 30px rgba(0,0,0,0.12); --radius: 12px; --radius-sm: 8px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: var(--nero); min-height: 100vh; }
        .top-header { background: var(--tortora); color: var(--bianco); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--ombra); position: sticky; top: 0; z-index: 100; }
        .top-header h1 { font-size: 20px; font-weight: 700; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .btn-back { background: rgba(255,255,255,0.2); color: var(--bianco); border: 1px solid rgba(255,255,255,0.4); padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
        .settings-card { background: var(--bianco); border-radius: var(--radius); padding: 30px; box-shadow: var(--ombra); margin-bottom: 25px; }
        .settings-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--tortora-chiaro); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--tortora-scuro); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1.5px solid var(--tortora-chiaro); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; transition: border-color 0.2s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--tortora); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .btn-save { background: var(--verde); color: var(--bianco); border: none; padding: 12px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-save:hover { background: #1E8449; }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); z-index: 500; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: var(--tortora); }
        .loading-overlay.hidden { display: none; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: var(--nero); color: var(--bianco); padding: 16px 24px; border-radius: var(--radius-sm); z-index: 2000; opacity: 0; transform: translateY(20px); transition: all 0.3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .top-header { flex-direction: column; gap: 10px; } }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">Caricamento impostazioni...</div>
    <div class="top-header">
        <h1>Impostazioni Palestra</h1>
        <div class="header-right">
            <a href="dashboard-palestra.html" class="btn-back">← Torna alla Dashboard</a>
        </div>
    </div>
    <div class="container">
        <div class="settings-card">
            <h2>Dati Generali</h2>
            <form id="formImpostazioni" onsubmit="salvaImpostazioni(event)">
                <input type="hidden" id="palestraId">
                <div class="form-group">
                    <label>Nome Palestra *</label>
                    <input type="text" id="nome" required placeholder="Es. Fitness Center Roma">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Città</label>
                        <input type="text" id="citta" placeholder="Es. Roma">
                    </div>
                    <div class="form-group">
                        <label>Telefono</label>
                        <input type="text" id="telefono" placeholder="Es. 06 1234567">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Es. info@palestra.it">
                </div>
                <button type="submit" class="btn-save" id="btnSave">Salva Modifiche</button>
            </form>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
    const API_URL = 'https://ancient-fire-7347.mairaluigi-b2f.workers.dev';
    let palestraData = null;

    async function init() {
        const userStr = localStorage.getItem('currentUser');
        if (!userStr) { window.location.href = 'index.html'; return; }
        const currentUser = JSON.parse(userStr);
        
        try {
            const palestreRes = await fetch(`${API_URL}/api/palestre`);
            const palestre = await palestreRes.json();
            palestraData = palestre.find(p => p.username === currentUser.id_univoco || p.id === currentUser.riferimento_id);
            
            if (palestraData) {
                document.getElementById('palestraId').value = palestraData.id;
                document.getElementById('nome').value = palestraData.nome || '';
                document.getElementById('citta').value = palestraData.citta || '';
                document.getElementById('telefono').value = palestraData.telefono || '';
                document.getElementById('email').value = palestraData.email || '';
            }
        } catch (error) {
            console.error('Errore:', error);
            showToast('Errore di caricamento dati');
        } finally {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }
    }

    async function salvaImpostazioni(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSave');
        btn.disabled = true;
        btn.textContent = 'Salvataggio in corso...';

        const data = {
            nome: document.getElementById('nome').value.trim(),
            citta: document.getElementById('citta').value.trim(),
            telefono: document.getElementById('telefono').value.trim(),
            email: document.getElementById('email').value.trim(),
            stato: palestraData.stato,
            data_scadenza: palestraData.data_scadenza
        };

        try {
            const res = await fetch(`${API_URL}/api/palestre/${palestraData.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (res.ok) {
                showToast('✅ Impostazioni salvate con successo!');
                palestraData = { ...palestraData, ...data };
            } else {
                showToast('❌ Errore durante il salvataggio');
            }
        } catch (error) {
            console.error('Errore:', error);
            showToast('❌ Errore di connessione');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Salva Modifiche';
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    init();
    </script>
</body>
</html>
