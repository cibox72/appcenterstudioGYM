<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppCenterStudioGYM - Gestione Palestra</title>
    <style>
        :root {
            --nero: #1A1A1A;
            --tortora: #9C928A;
            --tortora-scuro: #7A716A;
            --tortora-chiaro: #E8E3DE;
            --tortora-chiarissimo: #F5F2EF;
            --bianco: #FFFFFF;
            --verde: #27AE60;
            --verde-chiaro: #D5F5E3;
            --arancione: #F39C12;
            --arancione-chiaro: #FDEBD0;
            --rosso: #E74C3C;
            --rosso-chiaro: #FADBD8;
            --blu: #3498DB;
            --whatsapp: #25D366;
            --ombra: 0 2px 12px rgba(156, 146, 138, 0.15);
            --ombra-forte: 0 4px 20px rgba(156, 146, 138, 0.25);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #F5F2EF 0%, #FFFFFF 50%, #F5F2EF 100%);
            color: var(--nero);
            min-height: 100vh;
        }
        
        /* HEADER */
        .main-header {
            background: linear-gradient(135deg, var(--tortora) 0%, var(--tortora-scuro) 100%);
            color: var(--bianco);
            padding: 20px 30px;
            box-shadow: var(--ombra-forte);
        }
        .main-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        /* TAB PRINCIPALI - GRANDI E VISIBILI */
        .main-tabs-container {
            max-width: 1400px;
            margin: 30px auto 0;
            padding: 0 30px;
        }
        .main-tabs {
            display: flex;
            gap: 15px;
            background: var(--tortora-chiarissimo);
            padding: 15px;
            border-radius: var(--radius);
            border: 2px solid var(--tortora-chiaro);
            box-shadow: var(--ombra);
        }
        .main-tab {
            flex: 1;
            padding: 20px 30px;
            border: 3px solid transparent;
            border-radius: var(--radius);
            background: var(--bianco);
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            color: var(--tortora-scuro);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: inherit;
            letter-spacing: 0.5px;
        }
        .main-tab:hover {
            background: var(--tortora-chiaro);
            transform: translateY(-2px);
            box-shadow: var(--ombra);
        }
        .main-tab.active {
            background: var(--tortora);
            color: var(--bianco);
            border-color: var(--tortora-scuro);
            box-shadow: var(--ombra-forte);
        }
        .main-tab .tab-icon {
            font-size: 24px;
        }
        .main-tab .tab-text {
            font-size: 18px;
        }
        
        /* CONTENUTO */
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 30px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* SEZIONE ATLETI */
        .section-header {
            margin-bottom: 25px;
        }
        .section-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--nero);
            margin-bottom: 8px;
        }
        .section-header p {
            font-size: 14px;
            color: var(--tortora-scuro);
        }
        
        /* SEARCH */
        .search-box {
            background: var(--bianco);
            border: 2px solid var(--tortora-chiaro);
            border-radius: var(--radius);
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--ombra);
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            color: var(--nero);
        }
        .search-box input::placeholder { color: var(--tortora); }
        .search-icon { font-size: 20px; color: var(--tortora); }
        
        /* CARD ATLETI */
        .atleti-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        .atleta-card {
            background: var(--bianco);
            border: 2px solid var(--tortora-chiaro);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--ombra);
            transition: all 0.2s;
            position: relative;
        }
        .atleta-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--ombra-forte);
            border-color: var(--tortora);
        }
        .atleta-id {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--tortora);
            color: var(--bianco);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 0.5px;
        }
        .atleta-nome {
            font-size: 22px;
            font-weight: 700;
            color: var(--nero);
            margin-bottom: 15px;
            padding-right: 80px;
        }
        .atleta-info {
            margin-bottom: 20px;
        }
        .atleta-info .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .atleta-info .info-label {
            font-weight: 700;
            color: var(--nero);
            min-width: 100px;
        }
        .atleta-info .info-value {
            color: var(--tortora-scuro);
        }
        .atleta-info .info-value a {
            color: var(--blu);
            text-decoration: none;
        }
        .atleta-info .info-value a:hover { text-decoration: underline; }
        
        /* STATUS BADGE */
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }
        .status-scaduto {
            background: var(--rosso-chiaro);
            color: #922B21;
            border: 2px solid var(--rosso);
        }
        .status-attivo {
            background: var(--verde-chiaro);
            color: #1E8449;
            border: 2px solid var(--verde);
        }
        .status-scadenza {
            background: var(--arancione-chiaro);
            color: #9C640C;
            border: 2px solid var(--arancione);
        }
        
        /* AZIONI CARD */
        .card-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 15px;
            border-top: 1px solid var(--tortora-chiaro);
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-whatsapp {
            background: var(--whatsapp);
            color: var(--bianco);
        }
        .btn-whatsapp:hover { background: #128C7E; transform: translateY(-2px); }
        .btn-ricevute {
            background: var(--blu);
            color: var(--bianco);
        }
        .btn-ricevute:hover { background: #2980B9; }
        .btn-modifica {
            background: var(--bianco);
            color: var(--nero);
            border: 2px solid var(--nero);
        }
        .btn-modifica:hover { background: var(--nero); color: var(--bianco); }
        .btn-elimina {
            background: var(--rosso);
            color: var(--bianco);
        }
        .btn-elimina:hover { background: #C0392B; }
        .btn-scheda {
            background: var(--viola, #8E44AD);
            color: var(--bianco);
        }
        .btn-scheda:hover { background: #6C3483; }
        
        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--tortora);
            background: var(--bianco);
            border-radius: var(--radius);
            border: 2px dashed var(--tortora-chiaro);
        }
        .empty-state .icon { font-size: 64px; margin-bottom: 15px; }
        .empty-state .title { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--nero); }
        .empty-state .text { font-size: 14px; }
        
        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--nero);
            color: var(--bianco);
            padding: 16px 24px;
            border-radius: var(--radius-sm);
            box-shadow: var(--ombra-forte);
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        
        @media (max-width: 768px) {
            .main-tabs { flex-direction: column; }
            .main-tab { padding: 15px 20px; }
            .atleti-grid { grid-template-columns: 1fr; }
            .container { padding: 0 15px; }
            .main-tabs-container { padding: 0 15px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="main-header">
        <h1>AppCenterStudioGYM - Gestione Palestra</h1>
    </div>

    <!-- TAB PRINCIPALI GRANDI E VISIBILI -->
    <div class="main-tabs-container">
        <div class="main-tabs">
            <button class="main-tab active" onclick="showMainTab('atleti')">
                <span class="tab-icon">👥</span>
                <span class="tab-text">Atleti</span>
            </button>
            <button class="main-tab" onclick="showMainTab('impostazioni')">
                <span class="tab-icon">⚙️</span>
                <span class="tab-text">Impostazioni Palestra</span>
            </button>
        </div>
    </div>

    <div class="container">
        <!-- TAB ATLETI -->
        <div class="tab-content active" id="tab-atleti">
            <div class="section-header">
                <h2>I Tuoi Atleti</h2>
                <p>Gestisci anagrafiche, abbonamenti, pagamenti e credenziali</p>
            </div>

            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Cerca atleta per nome, cognome o ID..." oninput="filtraAtleti()">
            </div>

            <div class="atleti-grid" id="atletiGrid">
                <!-- Caricati dinamicamente -->
            </div>
        </div>

        <!-- TAB IMPOSTAZIONI -->
        <div class="tab-content" id="tab-impostazioni">
            <div class="section-header">
                <h2>Impostazioni Palestra</h2>
                <p>Configura i dati della tua palestra e i metodi di pagamento</p>
            </div>
            <div class="empty-state">
                <div class="icon">⚙️</div>
                <div class="title">Sezione in sviluppo</div>
                <div class="text">Qui potrai configurare i metodi di pagamento e i dati della palestra</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    const API_URL = 'https://ancient-fire-7347.mairaluigi-b2f.workers.dev';
    let atleti = [];
    let palestraData = null;

    // Dati demo (in produzione arrivano dal database)
    const atletiDemo = [
        {
            id: 1,
            nome: 'Marco Bianchi',
            telefono: '3244445567',
            email: 'marco@test',
            obiettivo: 'Mantenimento',
            dataScadenza: '1970-01-01',
            username: '4M275',
            stato: 'scaduto'
        },
        {
            id: 2,
            nome: 'Marco Bianchi',
            telefono: '3244445567',
            email: 'marco@test',
            obiettivo: 'Mantenimento',
            dataScadenza: '1970-01-01',
            username: '4M346',
            stato: 'scaduto'
        }
    ];

    function init() {
        // In produzione: carica da API
        atleti = atletiDemo;
        renderAtleti();
    }

    function showMainTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${tabName}`).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function renderAtleti(lista = atleti) {
        const grid = document.getElementById('atletiGrid');
        
        if (lista.length === 0) {
            grid.innerHTML = `
                <div class="empty-state" style="grid-column: 1/-1;">
                    <div class="icon"></div>
                    <div class="title">Nessun atleta trovato</div>
                    <div class="text">Aggiungi il tuo primo atleta per iniziare</div>
                </div>
            `;
            return;
        }

        let html = '';
        lista.forEach(atleta => {
            const giorniScadenza = calcolaGiorniScadenza(atleta.dataScadenza);
            let statusClass = 'status-attivo';
            let statusText = 'Attivo';
            
            if (giorniScadenza < 0) {
                statusClass = 'status-scaduto';
                statusText = `SCADUTO (${Math.abs(giorniScadenza)}GG)`;
            } else if (giorniScadenza <= 30) {
                statusClass = 'status-scadenza';
                statusText = `Scade tra ${giorniScadenza}GG`;
            }

            // Formatta numero per WhatsApp (aggiungi prefisso Italia se manca)
            let numeroWhatsapp = atleta.telefono.replace(/\D/g, '');
            if (!numeroWhatsapp.startsWith('39') && numeroWhatsapp.length === 10) {
                numeroWhatsapp = '39' + numeroWhatsapp;
            }
            const linkWhatsapp = `https://wa.me/${numeroWhatsapp}`;
            const messaggio = encodeURIComponent(`Ciao ${atleta.nome.split(' ')[0]}! Ti contattiamo dalla palestra.`);

            html += `
                <div class="atleta-card">
                    <div class="atleta-id">${atleta.username}</div>
                    <div class="atleta-nome">${atleta.nome}</div>
                    
                    <div class="atleta-info">
                        <div class="info-row">
                            <span class="info-label">Tel:</span>
                            <span class="info-value"><a href="tel:${atleta.telefono}">${atleta.telefono}</a></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Email:</span>
                            <span class="info-value"><a href="mailto:${atleta.email}">${atleta.email}</a></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Obiettivo:</span>
                            <span class="info-value">${atleta.obiettivo}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Scadenza:</span>
                            <span class="info-value">${formatData(atleta.dataScadenza)}</span>
                        </div>
                    </div>

                    <span class="status-badge ${statusClass}">${statusText}</span>

                    <div class="card-actions">
                        <a href="${linkWhatsapp}?text=${messaggio}" target="_blank" class="btn btn-whatsapp">
                             WhatsApp
                        </a>
                        <button class="btn btn-ricevute" onclick="apriRicevute(${atleta.id})">
                            Ricevute
                        </button>
                        <button class="btn btn-modifica" onclick="modificaAtleta(${atleta.id})">
                            Modifica
                        </button>
                        <button class="btn btn-elimina" onclick="eliminaAtleta(${atleta.id})">
                            Elimina
                        </button>
                    </div>
                </div>
            `;
        });

        grid.innerHTML = html;
    }

    function calcolaGiorniScadenza(dataScadenza) {
        const oggi = new Date();
        const scadenza = new Date(dataScadenza);
        return Math.ceil((scadenza - oggi) / (1000 * 60 * 60 * 24));
    }

    function formatData(dataStr) {
        if (!dataStr) return '--';
        const data = new Date(dataStr);
        return data.toLocaleDateString('it-IT');
    }

    function filtraAtleti() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!query) {
            renderAtleti(atleti);
            return;
        }
        const filtrati = atleti.filter(a => 
            a.nome.toLowerCase().includes(query) || 
            a.username.toLowerCase().includes(query) ||
            a.email.toLowerCase().includes(query)
        );
        renderAtleti(filtrati);
    }

    function apriRicevute(id) {
        showToast('📄 Sezione ricevute in sviluppo');
    }

    function modificaAtleta(id) {
        showToast('✏️ Modifica atleta in sviluppo');
    }

    function eliminaAtleta(id) {
        if (!confirm('Sei sicuro di voler eliminare questo atleta?')) return;
        atleti = atleti.filter(a => a.id !== id);
        renderAtleti();
        showToast('Atleta eliminato');
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    init();
    </script>
</body>
</html>
