<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - AppCenterStudioGYM</title>
    <style>
        :root {
            --nero: #1A1A1A;
            --tortora: #9C928A;
            --tortora-scuro: #7A716A;
            --tortora-chiaro: #E8E3DE;
            --tortora-chiarissimo: #F5F2EF;
            --bianco: #FFFFFF;
            --rosso: #E74C3C;
            --ombra: 0 4px 20px rgba(156, 146, 138, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #F5F2EF 0%, #FFFFFF 50%, #F5F2EF 100%);
            color: var(--nero);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: var(--bianco);
            border: 2px solid var(--tortora);
            border-radius: var(--radius);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--ombra);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--tortora-chiaro);
        }
        
        .login-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--nero);
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        
        .login-header p {
            font-size: 11px;
            color: var(--tortora);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--tortora-scuro);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--tortora-chiaro);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            background: var(--bianco);
            color: var(--nero);
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--tortora);
        }
        
        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--tortora);
            color: var(--bianco);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            background: var(--nero);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #FADBD8;
            color: #922B21;
            border: 1px solid var(--rosso);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        
        .error-message.show {
            display: block;
        }
        
        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 11px;
            color: var(--tortora);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>AppCenterStudioGYM</h1>
            <p>Accesso Riservato</p>
        </div>

        <div class="error-message" id="errorMessage">
            Username o password non corretti.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="Inserisci il tuo username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Inserisci la tua password">
            </div>
            
            <button type="submit" class="btn-login" id="btnLogin">Accedi</button>
        </form>

        <div class="footer-text">
            Sistema di gestione professionale per palestre
        </div>
    </div>

    <script>
        const API_URL = 'https://ancient-fire-7347.mairaluigi-b2f.workers.dev';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorMessage');
            
            // Nascondi errore precedente
            errorMsg.classList.remove('show');
            
            // Disabilita bottone durante il caricamento
            btn.disabled = true;
            btn.textContent = 'Verifica in corso...';
            
            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Salva i dati dell'utente nel browser
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    // Reindirizza in base al ruolo
                    if (data.user.ruolo === 'fornitore') {
                        window.location.href = 'dashboard-fornitore.html';
                    } else if (data.user.ruolo === 'palestra') {
                        window.location.href = 'dashboard-palestra.html';
                    } else if (data.user.ruolo === 'atleta') {
                        window.location.href = 'dashboard-atleta.html';
                    } else {
                        // Ruolo non riconosciuto, manda alla home
                        window.location.href = 'dashboard-fornitore.html';
                    }
                } else {
                    // Mostra errore
                    errorMsg.textContent = data.message || 'Credenziali non valide.';
                    errorMsg.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Accedi';
                }
            } catch (error) {
                console.error('Errore di connessione:', error);
                errorMsg.textContent = 'Errore di connessione al server. Riprova.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Accedi';
            }
        });
    </script>
</body>
</html>
