<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Atleti - AppCenterStudioGYM</title>
    <style>
        :root { --nero: #1A1A1A; --tortora: #9C928A; --tortora-scuro: #7A716A; --tortora-chiaro: #E8E3DE; --tortora-chiarissimo: #F5F2EF; --bianco: #FFFFFF; --verde: #27AE60; --verde-chiaro: #D5F5E3; --arancione: #F39C12; --arancione-chiaro: #FDEBD0; --rosso: #E74C3C; --rosso-chiaro: #FADBD8; --blu: #3498DB; --whatsapp: #25D366; --ombra: 0 2px 12px rgba(0,0,0,0.08); --ombra-forte: 0 8px 30px rgba(0,0,0,0.12); --radius: 12px; --radius-sm: 8px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: var(--nero); min-height: 100vh; }
        .top-header { background: var(--tortora); color: var(--bianco); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--ombra); position: sticky; top: 0; z-index: 100; }
        .top-header h1 { font-size: 20px; font-weight: 700; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .btn-back { background: rgba(255,255,255,0.2); color: var(--bianco); border: 1px solid rgba(255,255,255,0.4); padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .section-header h2 { font-size: 24px; font-weight: 700; }
        .btn-primary { background: var(--tortora); color: var(--bianco); border: none; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--tortora-scuro); }
        .search-box { background: var(--bianco); border: 1px solid var(--tortora-chiaro); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 25px; display: flex; align-items: center; }
        .search-box input { flex: 1; border: none; outline: none; font-size: 14px; font-family: inherit; }
        .atleti-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .atleta-card { background: var(--bianco); border-radius: var(--radius); padding: 20px; box-shadow: var(--ombra); border-left: 4px solid var(--tortora-chiaro); transition: transform 0.2s; }
        .atleta-card:hover { transform: translateY(-2px); box-shadow: var(--ombra-forte); }
        .atleta-card.scaduto { border-left-color: var(--rosso); }
        .atleta-card.scadenza { border-left-color: var(--arancione); }
        .atleta-card.attivo { border-left-color: var(--verde); }
        .atleta-nome { font-size: 18px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .atleta-id { font-size: 11px; background: var(--tortora-chiarissimo); padding: 4px 8px; border-radius: 4px; font-family: monospace; color: var(--tortora-scuro); }
        .atleta-info { font-size: 13px; color: var(--tortora-scuro); margin-bottom: 15px; }
        .atleta-info div { margin-bottom: 6px; display: flex; gap: 8px; }
        .atleta-info strong { min-width: 70px; color: var(--nero); }
        .atleta-info a { color: var(--blu); text-decoration: none; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; }
        .status-attivo { background: var(--verde-chiaro); color: #1E8449; }
        .status-scadenza { background: var(--arancione-chiaro); color: #9C640C; }
        .status-scaduto { background: var(--rosso-chiaro); color: #922B21; }
        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 15px; border-top: 1px solid var(--tortora-chiaro); }
        .btn { padding: 8px 14px; border: none; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .btn-whatsapp { background: var(--whatsapp); color: var(--bianco); }
        .btn-whatsapp:hover { background: #128C7E; }
        .btn-scheda { background: var(--blu); color: var(--bianco); }
        .btn-scheda:hover { background: #2980B9; }
        .btn-elimina { background: var(--bianco); color: var(--rosso); border: 1px solid var(--rosso); }
        .btn-elimina:hover { background: var(--rosso); color: var(--bianco); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--tortora); background: var(--bianco); border-radius: var(--radius); border: 2px dashed var(--tortora-chiaro); grid-column: 1/-1; }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); z-index: 500; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: var(--tortora); }
        .loading-overlay.hidden { display: none; }
        @media (max-width: 600px) { .atleti-grid { grid-template-columns: 1fr; } .top-header { flex-direction: column; gap: 10px; } }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">Caricamento atleti...</div>
    <div class="top-header">
        <h1>Gestione Atleti</h1>
        <div class="header-right">
            <a href="dashboard-palestra.html" class="btn-back">← Torna alla Dashboard</a>
        </div>
    </div>
    <div class="container">
        <div class="section-header">
            <h2>I Tuoi Atleti</h2>
            <a href="#" class="btn-primary" onclick="alert('Funzionalità di aggiunta atleta da implementare con modal dedicato')">+ Nuovo Atleta</a>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cerca per nome, ID o telefono..." oninput="filtraAtleti()">
        </div>
        <div class="atleti-grid" id="atletiGrid">
            <div class="empty-state">Caricamento in corso...</div>
        </div>
    </div>
    <script>
    const API_URL = 'https://ancient-fire-7347.mairaluigi-b2f.workers.dev';
    let atleti = [];
    let palestraId = null;

    async function init() {
        const userStr = localStorage.getItem('currentUser');
        if (!userStr) { window.location.href = 'index.html'; return; }
        const currentUser = JSON.parse(userStr);
        
        try {
            const palestreRes = await fetch(`${API_URL}/api/palestre`);
            const palestre = await palestreRes.json();
            const palestra = palestre.find(p => p.username === currentUser.id_univoco || p.id === currentUser.riferimento_id);
            if (palestra) {
                palestraId = palestra.id;
                const atletiRes = await fetch(`${API_URL}/api/atleti?palestra_id=${palestraId}`);
                atleti = await atletiRes.json();
                renderAtleti();
            }
        } catch (error) {
            console.error('Errore:', error);
            document.getElementById('atletiGrid').innerHTML = '<div class="empty-state">Errore di caricamento dati.</div>';
        } finally {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }
    }

    function renderAtleti(lista = atleti) {
        const grid = document.getElementById('atletiGrid');
        if (lista.length === 0) {
            grid.innerHTML = '<div class="empty-state">Nessun atleta trovato. Aggiungine uno nuovo!</div>';
            return;
        }
        let html = '';
        lista.forEach(a => {
            const oggi = new Date();
            const scadenza = a.data_scadenza ? new Date(a.data_scadenza) : null;
            let giorni = scadenza ? Math.ceil((scadenza - oggi) / (1000 * 60 * 60 * 24)) : 999;
            let statusClass = 'attivo', statusText = 'Attivo';
            
            if (giorni < 0) { statusClass = 'scaduto'; statusText = `Scaduto`; }
            else if (giorni <= 30) { statusClass = 'scadenza'; statusText = `Scade tra ${giorni}gg`; }

            let numeroWhatsapp = (a.telefono || '').replace(/\D/g, '');
            if (!numeroWhatsapp.startsWith('39') && numeroWhatsapp.length === 10) numeroWhatsapp = '39' + numeroWhatsapp;
            const linkWa = numeroWhatsapp ? `https://wa.me/${numeroWhatsapp}?text=${encodeURIComponent(`Ciao ${a.nome ? a.nome.split(' ')[0] : ''}!`)}` : '#';

            html += `
                <div class="atleta-card ${statusClass}">
                    <div class="atleta-nome">
                        ${a.nome || 'Senza Nome'}
                        <span class="atleta-id">${a.username || 'N/D'}</span>
                    </div>
                    <span class="status-badge status-${statusClass}">${statusText}</span>
                    <div class="atleta-info">
                        <div><strong>Tel:</strong> <a href="tel:${a.telefono}">${a.telefono || 'N/D'}</a></div>
                        <div><strong>Email:</strong> <a href="mailto:${a.email}">${a.email || 'N/D'}</a></div>
                        <div><strong>Scadenza:</strong> ${a.data_scadenza ? new Date(a.data_scadenza).toLocaleDateString('it-IT') : 'N/D'}</div>
                    </div>
                    <div class="card-actions">
                        ${numeroWhatsapp ? `<a href="${linkWa}" target="_blank" class="btn btn-whatsapp">WhatsApp</a>` : ''}
                        <a href="schede-allenamenti.html?atleta_id=${a.id}" class="btn btn-scheda">Scheda</a>
                        <button class="btn btn-elimina" onclick="eliminaAtleta(${a.id})">Elimina</button>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    function filtraAtleti() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtrati = atleti.filter(a => 
            (a.nome && a.nome.toLowerCase().includes(q)) || 
            (a.username && a.username.toLowerCase().includes(q)) ||
            (a.telefono && a.telefono.includes(q))
        );
        renderAtleti(filtrati);
    }

    async function eliminaAtleta(id) {
        if (!confirm('Sei sicuro di voler eliminare questo atleta?')) return;
        try {
            await fetch(`${API_URL}/api/atleti/${id}`, { method: 'DELETE' });
            atleti = atleti.filter(a => a.id !== id);
            renderAtleti();
        } catch (e) { alert('Errore durante l\'eliminazione'); }
    }

    init();
    </script>
</body>
</html>
