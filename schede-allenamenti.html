<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schede Allenamento - AppCenterStudioGYM</title>
    <style>
        :root {
            --nero: #1A1A1A; --tortora: #9C928A; --tortora-scuro: #7A716A; --tortora-chiaro: #E8E3DE;
            --tortora-chiarissimo: #F5F2EF; --bianco: #FFFFFF; --verde: #27AE60; --verde-chiaro: #D5F5E3;
            --arancione: #F39C12; --rosso: #E74C3C; --blu: #3498DB; --viola: #8E44AD;
            --ombra: 0 2px 12px rgba(0,0,0,0.08); --ombra-forte: 0 8px 30px rgba(0,0,0,0.12);
            --radius: 12px; --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: var(--nero); min-height: 100vh; padding-bottom: 30px; }
        .top-header { background: var(--tortora); color: var(--bianco); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--ombra); position: sticky; top: 0; z-index: 100; }
        .top-header h1 { font-size: 18px; font-weight: 700; }
        .btn-logout { background: rgba(255,255,255,0.2); color: var(--bianco); border: 1px solid rgba(255,255,255,0.4); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .section-header { margin-bottom: 20px; }
        .section-header h2 { font-size: 22px; margin-bottom: 5px; }
        .section-header .subtitle { font-size: 13px; color: var(--tortora-scuro); }
        .cliente-selector { background: var(--bianco); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--ombra); }
        .cliente-selector label { font-size: 12px; font-weight: 700; color: var(--tortora-scuro); text-transform: uppercase; letter-spacing: 0.8px; display: block; margin-bottom: 8px; }
        .cliente-selector select { width: 100%; padding: 12px; border: 1.5px solid var(--tortora-chiaro); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; }
        .cliente-selector select:focus { outline: none; border-color: var(--tortora); }
        .days-tabs { display: flex; gap: 6px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; flex-wrap: wrap; }
        .day-tab { padding: 10px 16px; background: var(--bianco); border: 2px solid var(--tortora-chiaro); border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 13px; color: var(--tortora-scuro); white-space: nowrap; transition: all 0.2s; }
        .day-tab.active { background: var(--tortora); color: var(--bianco); border-color: var(--tortora); }
        .day-content { display: none; background: var(--bianco); border-radius: var(--radius); padding: 20px; box-shadow: var(--ombra); min-height: 400px; }
        .day-content.active { display: block; }
        .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--tortora-chiaro); }
        .day-header h3 { font-size: 18px; }
        .exercise-list { margin-bottom: 20px; }
        .exercise-item { background: var(--tortora-chiarissimo); border-radius: var(--radius-sm); padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--tortora); }
        .exercise-item .ex-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 5px; }
        .exercise-item .ex-name { font-weight: 700; font-size: 15px; }
        .exercise-item .ex-badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: 600; }
        .exercise-item .ex-badge.esercizio { background: var(--verde-chiaro); color: #1E8449; }
        .exercise-item .ex-badge.video { background: #FADBD8; color: var(--rosso); }
        .exercise-item .ex-desc { font-size: 13px; color: var(--tortora-scuro); margin-bottom: 8px; }
        .exercise-item .ex-details { font-size: 12px; color: var(--tortora); margin-bottom: 8px; }
        .exercise-item img { max-width: 100%; max-height: 200px; border-radius: var(--radius-sm); margin-top: 8px; display: block; }
        .exercise-item .ex-actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
        .btn { padding: 8px 14px; border: none; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; font-family: inherit; transition: all 0.2s; }
        .btn-primary { background: var(--tortora); color: var(--bianco); }
        .btn-primary:hover { background: var(--nero); }
        .btn-success { background: var(--verde); color: var(--bianco); }
        .btn-success:hover { background: #1E8449; }
        .btn-danger { background: var(--rosso); color: var(--bianco); }
        .btn-secondary { background: var(--bianco); color: var(--nero); border: 1.5px solid var(--nero); }
        .btn-info { background: var(--blu); color: var(--bianco); }
        .btn-view { background: var(--viola); color: var(--bianco); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--tortora); background: var(--tortora-chiarissimo); border-radius: var(--radius-sm); border: 2px dashed var(--tortora-chiaro); }
        .empty-state .icon { font-size: 48px; margin-bottom: 15px; opacity: 0.5; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bianco); border-radius: var(--radius); padding: 25px; max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--tortora-chiaro); }
        .modal-title { font-size: 18px; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--tortora); line-height: 1; }
        .modal-close:hover { color: var(--nero); }
        .archive-select-list { max-height: 500px; overflow-y: auto; border: 1px solid var(--tortora-chiaro); border-radius: var(--radius-sm); padding: 10px; }
        .archive-section-title { font-size: 13px; font-weight: 700; color: var(--tortora); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 5px 5px; border-bottom: 1px solid var(--tortora-chiaro); margin-bottom: 5px; position: sticky; top: 0; background: var(--bianco); }
        .archive-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--tortora-chiarissimo); cursor: pointer; transition: background 0.15s; }
        .archive-item:last-child { border-bottom: none; }
        .archive-item:hover { background: var(--tortora-chiarissimo); }
        .archive-item input { width: auto; margin: 0; }
        .archive-item label { margin: 0; font-size: 13px; cursor: pointer; flex: 1; font-weight: 500; }
        .archive-item .item-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: var(--radius-sm); flex-shrink: 0; background: var(--tortora-chiarissimo); border: 1px solid var(--tortora-chiaro); }
        .archive-item .item-thumb-placeholder { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: var(--tortora-chiarissimo); font-size: 24px; flex-shrink: 0; border: 1px solid var(--tortora-chiaro); color: var(--tortora); }
        .archive-item .item-info { flex: 1; }
        .archive-item .item-name { font-weight: 600; margin-bottom: 3px; }
        .archive-item .item-meta { font-size: 11px; color: var(--tortora); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--bianco); padding-top: 15px; border-top: 2px solid var(--tortora-chiaro); }
        .preview-modal { max-width: 700px; }
        .preview-content { text-align: center; }
        .preview-content img { max-width: 100%; max-height: 500px; border-radius: var(--radius-sm); margin-bottom: 15px; }
        .preview-content iframe { width: 100%; height: 400px; border: none; border-radius: var(--radius-sm); }
        .preview-details { text-align: left; background: var(--tortora-chiarissimo); padding: 15px; border-radius: var(--radius-sm); margin-top: 15px; }
        .preview-details h4 { margin-bottom: 10px; }
        .preview-details p { margin-bottom: 6px; font-size: 14px; }
        .preview-details strong { color: var(--tortora-scuro); }
        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--nero); color: var(--bianco); padding: 12px 20px; border-radius: var(--radius-sm); z-index: 2000; opacity: 0; transform: translateY(20px); transition: all 0.3s; font-size: 14px; }
        .toast.show { opacity: 1; transform: translateY(0); }
        
        /* NUOVI STILI PER ALERT E BADGE */
        .alert-banner { padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 15px; font-size: 13px; font-weight: 600; display: none; }
        .alert-banner.show { display: block; }
        .alert-banner.success { background: var(--verde-chiaro); color: #1E8449; border: 1px solid var(--verde); }
        .alert-banner.warning { background: var(--arancione-chiaro); color: #9C640C; border: 1px solid var(--arancione); }
        .alert-banner.info { background: var(--tortora-chiarissimo); color: var(--tortora-scuro); border: 1px solid var(--tortora); }
        
        .week-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; margin-left: 10px; }
        .week-badge.new { background: var(--verde-chiaro); color: #1E8449; }
        .week-badge.same { background: var(--arancione-chiaro); color: #9C640C; }
        .week-badge.modified { background: var(--tortora-chiarissimo); color: var(--tortora-scuro); }
        
        .action-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
        
        @media (max-width: 768px) { .container { padding: 15px; } .day-header { flex-direction: column; align-items: flex-start; gap: 10px; } }
    </style>
</head>
<body>
    <div class="top-header">
        <h1>Schede Allenamento</h1>
        <a href="dashboard-palestra.html" class="btn-logout">Dashboard</a>
    </div>

    <div class="container">
        <div class="section-header">
            <h2>Scheda Allenamento Cliente</h2>
            <div class="subtitle">Crea la settimana di allenamento attingendo dall'archivio globale del fornitore</div>
        </div>

        <div class="cliente-selector">
            <label>Seleziona Atleta</label>
            <select id="clienteSelect" onchange="onClienteChange()">
                <option value="">-- Seleziona un atleta --</option>
            </select>
        </div>

        <div id="schedaClienteContent" style="display:none;">
            <div class="days-tabs" id="daysTabs"></div>
            <div id="daysContent"></div>
            
            <!-- ALERT BANNER PER CONFRONTO SETTIMANE -->
            <div id="alertBanner" class="alert-banner"></div>
            
            <!-- BADGE SETTIMANA -->
            <div id="weekBadgeContainer" style="margin-top: 15px;"></div>
            
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="duplicaSettimanaPrecedente()">Duplica Settimana Precedente</button>
                <button class="btn btn-success" onclick="salvaSettimana()">Salva Settimana Completa</button>
            </div>
        </div>
    </div>

    <!-- MODAL SELEZIONE DA ARCHIVIO GLOBALE -->
    <div class="modal-overlay" id="modalAggiungi">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Scegli dall'Archivio Globale</div>
                <button class="modal-close" onclick="chiudiModal('modalAggiungi')">&times;</button>
            </div>
            <div>
                <div id="archiveSelectList"></div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="chiudiModal('modalAggiungi')">Annulla</button>
                    <button class="btn btn-success" onclick="confermaAggiunta()">Aggiungi Selezionati</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PREVIEW -->
    <div class="modal-overlay" id="modalPreview">
        <div class="modal preview-modal">
            <div class="modal-header">
                <div class="modal-title" id="previewTitle">Anteprima</div>
                <button class="modal-close" onclick="chiudiModal('modalPreview')">&times;</button>
            </div>
            <div class="preview-content" id="previewContent"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    const API_URL = 'https://ancient-fire-7347.mairaluigi-b2f.workers.dev';
    const GIORNI = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
    
    let currentUser = null, palestraData = null, atleti = [];
    let eserciziGlobali = [], videoGlobali = [], schedeClienti = {};
    let clienteSelezionato = null, giornoSelezionato = 0;
    let settimanaCorrente = 1;

    function init() {
        const userStr = localStorage.getItem('currentUser');
        if (!userStr) { window.location.href = 'index.html'; return; }
        currentUser = JSON.parse(userStr);
        loadData();
    }

    async function loadData() {
        try {
            // Carica dati palestra
            const palestreRes = await fetch(`${API_URL}/api/palestre`);
            const palestre = await palestreRes.json();
            palestraData = palestre.find(p => p.username === currentUser.id_univoco || p.id === currentUser.riferimento_id);
            if (!palestraData) { showToast('Palestra non trovata'); return; }
            
            // Carica atleti
            const atletiRes = await fetch(`${API_URL}/api/atleti?palestra_id=${palestraData.id}`);
            atleti = await atletiRes.json();
            popolaSelectClienti();
            
            // Carica archivio globale esercizi
            const eserciziRes = await fetch(`${API_URL}/api/esercizi-globali`);
            eserciziGlobali = await eserciziRes.json();
            
            // Carica archivio globale video
            const videoRes = await fetch(`${API_URL}/api/video-globali`);
            videoGlobali = await videoRes.json();
            
            showToast(`Archivio caricato: ${eserciziGlobali.length} esercizi, ${videoGlobali.length} video`);
        } catch (error) { 
            console.error('Errore:', error); 
            showToast('Errore di connessione'); 
        }
    }

    function popolaSelectClienti() {
        const select = document.getElementById('clienteSelect');
        select.innerHTML = '<option value="">-- Seleziona un atleta --</option>';
        atleti.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a.id;
            opt.textContent = `${a.nome} (${a.username || '-'})`;
            select.appendChild(opt);
        });
    }

    async function onClienteChange() {
        const id = document.getElementById('clienteSelect').value;
        if (!id) {
            document.getElementById('schedaClienteContent').style.display = 'none';
            return;
        }
        clienteSelezionato = atleti.find(a => a.id == id);
        document.getElementById('schedaClienteContent').style.display = 'block';
        
        try {
            // Carica scheda esistente
            const res = await fetch(`${API_URL}/api/schede-clienti?atleta_id=${clienteSelezionato.id}&palestra_id=${palestraData.id}`);
            const items = await res.json();
            
            // Organizza per giorno
            schedeClienti = {};
            items.forEach(item => {
                const chiave = `${item.atleta_id}_${item.giorno}`;
                if (!schedeClienti[chiave]) schedeClienti[chiave] = [];
                schedeClienti[chiave].push({ 
                    tipo: item.tipo, 
                    id: item.elemento_id, 
                    dbId: item.id, 
                    ordine: item.ordine 
                });
            });
            
            // Determina la settimana corrente
            determinaSettimanaCorrente();
            
            renderGiorniTabs();
            mostraBadgeSettimana();
        } catch (error) {
            console.error('Errore caricamento scheda:', error);
            showToast('Errore caricamento scheda');
        }
    }

    function determinaSettimanaCorrente() {
        // Conta quante settimane diverse ci sono per questo atleta
        const settimane = new Set();
        Object.keys(schedeClienti).forEach(chiave => {
            const [atletaId, giorno] = chiave.split('_');
            settimane.add(giorno);
        });
        settimanaCorrente = settimane.size > 0 ? Math.max(...settimane) + 1 : 1;
    }

    function renderGiorniTabs() {
        const tabsContainer = document.getElementById('daysTabs');
        const contentContainer = document.getElementById('daysContent');
        tabsContainer.innerHTML = '';
        contentContainer.innerHTML = '';
        
        GIORNI.forEach((giorno, idx) => {
            const tab = document.createElement('div');
            tab.className = 'day-tab' + (idx === 0 ? ' active' : '');
            tab.textContent = giorno.substring(0, 3);
            tab.onclick = () => selezionaGiorno(idx);
            tabsContainer.appendChild(tab);
            
            const content = document.createElement('div');
            content.className = 'day-content' + (idx === 0 ? ' active' : '');
            content.id = `day-content-${idx}`;
            contentContainer.appendChild(content);
        });
        
        renderGiorno(0);
    }

    function selezionaGiorno(idx) {
        giornoSelezionato = idx;
        document.querySelectorAll('.day-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
        document.querySelectorAll('.day-content').forEach((c, i) => c.classList.toggle('active', i === idx));
        renderGiorno(idx);
    }

    function renderGiorno(idx) {
        const container = document.getElementById(`day-content-${idx}`);
        if (!container || !clienteSelezionato) return;
        
        const chiave = `${clienteSelezionato.id}_${idx}`;
        const eserciziGiorno = schedeClienti[chiave] || [];
        
        let html = `
            <div class="day-header">
                <h3>${GIORNI[idx]}</h3>
                <button class="btn btn-primary" onclick="apriAggiungi(${idx})">+ Aggiungi da Archivio Globale</button>
            </div>
            <div style="font-size: 12px; color: var(--tortora); margin-bottom: 15px;">
                ${eserciziGiorno.length} elementi programmati
            </div>
        `;
        
        if (eserciziGiorno.length === 0) {
            html += `
                <div class="empty-state">
                    <div class="icon"></div>
                    <div>Nessun esercizio per questo giorno</div>
                    <div style="font-size: 12px; margin-top: 10px;">Clicca "+ Aggiungi da Archivio Globale" per iniziare</div>
                </div>
            `;
        } else {
            html += '<div class="exercise-list">';
            eserciziGiorno.forEach((ex, exIdx) => {
                const tipo = ex.tipo;
                const data = tipo === 'esercizio' 
                    ? eserciziGlobali.find(e => e.id === ex.id)
                    : videoGlobali.find(v => v.id === ex.id);
                
                if (!data) {
                    html += `
                        <div class="exercise-item" style="opacity: 0.5;">
                            <div class="ex-header">
                                <div class="ex-name">Elemento non trovato</div>
                                <span class="ex-badge ${tipo}">${tipo === 'esercizio' ? 'Esercizio' : 'Video'}</span>
                            </div>
                            <div class="ex-actions">
                                <button class="btn btn-danger" onclick="rimuoviEsercizioDaGiorno(${idx}, ${exIdx}, ${ex.dbId})">Rimuovi</button>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                html += `
                    <div class="exercise-item">
                        <div class="ex-header">
                            <div class="ex-name">${data.nome || data.titolo}</div>
                            <span class="ex-badge ${tipo}">${tipo === 'esercizio' ? 'Esercizio' : 'Video'}</span>
                        </div>
                        <div class="ex-desc">${data.descrizione || 'Nessuna descrizione'}</div>
                `;
                
                if (tipo === 'esercizio') {
                    if (data.serie || data.recupero) {
                        html += `<div class="ex-details"><strong>Serie:</strong> ${data.serie || '-'}${data.recupero ? ` • <strong>Recupero:</strong> ${data.recupero}` : ''}</div>`;
                    }
                    if (data.file_base64) {
                        html += `<img src="${data.file_base64}" alt="${data.nome}">`;
                    }
                } else {
                    if (data.link) {
                        html += `<div class="ex-details">Link: <a href="${data.link}" target="_blank" style="color: var(--blu);">${data.link}</a></div>`;
                    }
                }
                
                html += `
                        <div class="ex-actions">
                            <button class="btn btn-view" onclick="visualizzaElemento(${ex.id}, '${tipo}')">Visualizza</button>
                            <button class="btn btn-danger" onclick="rimuoviEsercizioDaGiorno(${idx}, ${exIdx}, ${ex.dbId})">Rimuovi</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
        }
        
        container.innerHTML = html;
    }

    function visualizzaElemento(id, tipo) {
        const data = tipo === 'esercizio' ? eserciziGlobali.find(e => e.id === id) : videoGlobali.find(v => v.id === id);
        if (!data) return;
        
        document.getElementById('previewTitle').textContent = data.nome || data.titolo;
        let content = '';
        
        if (tipo === 'esercizio') {
            if (data.file_base64) {
                content += `<img src="${data.file_base64}" alt="${data.nome}">`;
            } else {
                content += `<div style="padding: 40px; background: var(--tortora-chiarissimo); border-radius: 8px; font-size: 48px;"></div>`;
            }
            content += `
                <div class="preview-details">
                    <h4>${data.nome}</h4>
                    <p><strong>Gruppo:</strong> ${data.gruppo || '-'}</p>
                    <p><strong>Serie:</strong> ${data.serie || '-'}</p>
                    <p><strong>Recupero:</strong> ${data.recupero || '-'}</p>
                    <p><strong>Descrizione:</strong><br>${data.descrizione || 'Nessuna descrizione'}</p>
                </div>
            `;
        } else {
            const videoId = extractVideoId(data.link);
            if (videoId) {
                content += `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
            } else {
                content += `<p style="padding: 20px; background: var(--tortora-chiarissimo); border-radius: 8px;">Video non disponibile per l'anteprima. <a href="${data.link}" target="_blank" style="color: var(--blu);">Apri in nuova scheda</a></p>`;
            }
            content += `
                <div class="preview-details">
                    <h4>${data.titolo}</h4>
                    <p><strong>Gruppo:</strong> ${data.gruppo || '-'}</p>
                    <p><strong>Link:</strong> <a href="${data.link}" target="_blank" style="color: var(--blu);">${data.link}</a></p>
                    <p><strong>Descrizione:</strong><br>${data.descrizione || 'Nessuna descrizione'}</p>
                </div>
            `;
        }
        
        document.getElementById('previewContent').innerHTML = content;
        document.getElementById('modalPreview').classList.add('active');
    }

    function extractVideoId(url) {
        if (!url) return null;
        const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
        return match ? match[1] : null;
    }

    function apriAggiungi(giornoIdx) {
        giornoSelezionato = giornoIdx;
        const list = document.getElementById('archiveSelectList');
        let html = '';
        
        // Sezione Esercizi
        if (eserciziGlobali.length > 0) {
            html += `<div class="archive-section-title">Esercizi (${eserciziGlobali.length})</div>`;
            eserciziGlobali.forEach(e => {
                const thumbHtml = e.file_base64 
                    ? `<img src="${e.file_base64}" class="item-thumb" alt="${e.nome}">`
                    : `<div class="item-thumb-placeholder"></div>`;
                html += `
                    <div class="archive-item">
                        <input type="checkbox" id="arch_ex_${e.id}" value="esercizio_${e.id}">
                        ${thumbHtml}
                        <div class="item-info">
                            <label for="arch_ex_${e.id}">
                                <div class="item-name">${e.nome}</div>
                                <div class="item-meta">${e.gruppo || ''}${e.serie ? ` • ${e.serie}` : ''}</div>
                            </label>
                        </div>
                    </div>
                `;
            });
        }
        
        // Sezione Video
        if (videoGlobali.length > 0) {
            html += `<div class="archive-section-title" style="margin-top: 15px;">Video (${videoGlobali.length})</div>`;
            videoGlobali.forEach(v => {
                const videoId = extractVideoId(v.link);
                const thumbUrl = videoId ? `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` : '';
                html += `
                    <div class="archive-item">
                        <input type="checkbox" id="arch_vid_${v.id}" value="video_${v.id}">
                        ${thumbUrl ? `<img src="${thumbUrl}" class="item-thumb" alt="${v.titolo}">` : '<div class="item-thumb-placeholder"></div>'}
                        <div class="item-info">
                            <label for="arch_vid_${v.id}">
                                <div class="item-name">${v.titolo}</div>
                                <div class="item-meta">${v.gruppo || ''}</div>
                            </label>
                        </div>
                    </div>
                `;
            });
        }
        
        if (eserciziGlobali.length === 0 && videoGlobali.length === 0) {
            html = '<div class="empty-state">Archivio globale vuoto. Contatta il fornitore.</div>';
        }
        
        list.innerHTML = html;
        document.getElementById('modalAggiungi').classList.add('active');
    }

    async function confermaAggiunta() {
        const checkboxes = document.querySelectorAll('#archiveSelectList input:checked');
        if (checkboxes.length === 0) { showToast('Seleziona almeno un elemento'); return; }
        
        const elementi = [];
        checkboxes.forEach(cb => {
            const [tipo, idStr] = cb.value.split('_');
            elementi.push({ tipo, elemento_id: parseInt(idStr) });
        });
        
        try {
            const res = await fetch(`${API_URL}/api/schede-clienti/batch`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    palestra_id: palestraData.id,
                    atleta_id: clienteSelezionato.id,
                    giorno: giornoSelezionato,
                    settimana: settimanaCorrente,
                    elementi: elementi
                })
            });
            const result = await res.json();
            if (result.success) {
                showToast(`Aggiunti ${elementi.length} elementi`);
                chiudiModal('modalAggiungi');
                await onClienteChange();
            } else {
                showToast('Errore: ' + (result.error || 'sconosciuto'));
            }
        } catch (error) {
            showToast('Errore di connessione');
        }
    }

    async function rimuoviEsercizioDaGiorno(giornoIdx, exIdx, dbId) {
        if (!confirm('Rimuovere questo elemento dalla giornata?')) return;
        try {
            const res = await fetch(`${API_URL}/api/schede-clienti/${dbId}`, { method: 'DELETE' });
            const result = await res.json();
            if (result.success) {
                showToast('Elemento rimosso');
                await onClienteChange();
            }
        } catch (error) {
            showToast('Errore');
        }
    }

    // NUOVA FUNZIONE: Duplica settimana precedente
    async function duplicaSettimanaPrecedente() {
        if (!clienteSelezionato) {
            showToast('Seleziona prima un atleta');
            return;
        }
        
        if (!confirm(`Vuoi duplicare la settimana ${settimanaCorrente - 1} nella settimana ${settimanaCorrente}?`)) {
            return;
        }
        
        try {
            // Carica la settimana precedente
            const res = await fetch(`${API_URL}/api/schede-clienti?atleta_id=${clienteSelezionato.id}&palestra_id=${palestraData.id}&settimana=${settimanaCorrente - 1}`);
            const items = await res.json();
            
            if (items.length === 0) {
                showToast('Nessuna settimana precedente da duplicare');
                return;
            }
            
            // Duplica ogni elemento nella nuova settimana
            for (const item of items) {
                await fetch(`${API_URL}/api/schede-clienti`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        palestra_id: palestraData.id,
                        atleta_id: clienteSelezionato.id,
                        giorno: item.giorno,
                        settimana: settimanaCorrente,
                        tipo: item.tipo,
                        elemento_id: item.elemento_id,
                        ordine: item.ordine
                    })
                });
            }
            
            showToast(`Settimana ${settimanaCorrente - 1} duplicata nella settimana ${settimanaCorrente}`);
            await onClienteChange();
        } catch (error) {
            console.error('Errore duplicazione:', error);
            showToast('Errore durante la duplicazione');
        }
    }

    // NUOVA FUNZIONE: Salva settimana con confronto
    async function salvaSettimana() {
        if (!clienteSelezionato) return;
        
        try {
            // Carica la settimana precedente per il confronto
            const resPrecedente = await fetch(`${API_URL}/api/schede-clienti?atleta_id=${clienteSelezionato.id}&palestra_id=${palestraData.id}&settimana=${settimanaCorrente - 1}`);
            const itemsPrecedenti = await resPrecedente.json();
            
            // Carica la settimana corrente
            const resCorrente = await fetch(`${API_URL}/api/schede-clienti?atleta_id=${clienteSelezionato.id}&palestra_id=${palestraData.id}&settimana=${settimanaCorrente}`);
            const itemsCorrenti = await resCorrente.json();
            
            // Confronta le due settimane
            const confronto = confrontaSettimane(itemsPrecedenti, itemsCorrenti);
            
            // Mostra alert appropriato
            mostraAlertConfronto(confronto);
            
            showToast('Settimana salvata con successo!');
            
            // Aggiorna badge
            mostraBadgeSettimana();
        } catch (error) {
            console.error('Errore salvataggio:', error);
            showToast('Settimana salvata con successo!');
        }
    }

    // NUOVA FUNZIONE: Confronta due settimane
    function confrontaSettimane(settimanaPrecedente, settimanaCorrente) {
        if (settimanaPrecedente.length === 0) {
            return { tipo: 'nuova', differenze: 0 };
        }
        
        if (settimanaCorrente.length === 0) {
            return { tipo: 'vuota', differenze: settimanaPrecedente.length };
        }
        
        // Confronta gli elementi
        const elementiPrecedenti = settimanaPrecedente.map(item => `${item.giorno}_${item.tipo}_${item.elemento_id}`).sort();
        const elementiCorrenti = settimanaCorrente.map(item => `${item.giorno}_${item.tipo}_${item.elemento_id}`).sort();
        
        const differenze = elementiPrecedenti.filter((item, idx) => item !== elementiCorrenti[idx]).length;
        
        if (differenze === 0) {
            return { tipo: 'uguale', differenze: 0 };
        } else {
            return { tipo: 'modificata', differenze: differenze };
        }
    }

    // NUOVA FUNZIONE: Mostra alert di confronto
    function mostraAlertConfronto(confronto) {
        const alertBanner = document.getElementById('alertBanner');
        alertBanner.className = 'alert-banner show';
        
        if (confronto.tipo === 'nuova') {
            alertBanner.classList.add('info');
            alertBanner.textContent = 'Nuova settimana - Nessun dato precedente disponibile per il confronto';
        } else if (confronto.tipo === 'uguale') {
            alertBanner.classList.add('warning');
            alertBanner.textContent = 'Attenzione: questa settimana è identica alla precedente. Nessun esercizio è stato cambiato.';
        } else if (confronto.tipo === 'modificata') {
            alertBanner.classList.add('success');
            alertBanner.textContent = `Settimana modificata - ${confronto.differenze} esercizi diversi rispetto alla settimana precedente`;
        } else if (confronto.tipo === 'vuota') {
            alertBanner.classList.add('warning');
            alertBanner.textContent = 'La settimana corrente è vuota. Tutti gli esercizi sono stati rimossi.';
        }
        
        // Nascondi l'alert dopo 5 secondi
        setTimeout(() => {
            alertBanner.classList.remove('show');
        }, 5000);
    }

    // NUOVA FUNZIONE: Mostra badge settimana
    function mostraBadgeSettimana() {
        const container = document.getElementById('weekBadgeContainer');
        container.innerHTML = `<span class="week-badge new">Settimana ${settimanaCorrente}</span>`;
    }

    function chiudiModal(id) { document.getElementById(id).classList.remove('active'); }
    
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('active'); }));

    init();
    </script>
