<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppCenterStudioGYM - Dashboard Fornitore</title>
    <style>
        :root {
            --nero: #1A1A1A;
            --tortora: #9C928A;
            --tortora-scuro: #7A716A;
            --tortora-chiaro: #E8E3DE;
            --tortora-chiarissimo: #F5F2EF;
            --bianco: #FFFFFF;
            --verde: #27AE60;
            --verde-chiaro: #D5F5E3;
            --arancione: #F39C12;
            --arancione-chiaro: #FDEBD0;
            --rosso: #E74C3C;
            --rosso-chiaro: #FADBD8;
            --ombra: 0 2px 12px rgba(156, 146, 138, 0.15);
            --ombra-forte: 0 4px 20px rgba(156, 146, 138, 0.25);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: radial-gradient(circle at center, #FFFFFF 0%, #F5F2EF 40%, #E8E3DE 100%);
            color: var(--nero);
            min-height: 100vh;
            padding: 20px;
        }
        
        /* HEADER UNIVERSALE */
        .main-header {
            max-width: 1400px;
            margin: 0 auto 25px;
            background: var(--bianco);
            border: 2px solid var(--tortora);
            border-radius: var(--radius);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--ombra);
            position: sticky;
            top: 10px;
            z-index: 100;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; flex: 1; min-width: 200px; }
        .header-title h1 { font-size: 20px; font-weight: 700; color: var(--nero); letter-spacing: 0.5px; }
        .header-title p { font-size: 10px; color: var(--tortora); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; margin-top: 2px; }
        .header-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .nav-btn {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            font-family: inherit;
            border: 1.5px solid transparent;
            white-space: nowrap;
        }
        .nav-btn-home { background: var(--tortora-chiarissimo); color: var(--tortora-scuro); border-color: var(--tortora-chiaro); }
        .nav-btn-home:hover { background: var(--tortora); color: var(--bianco); border-color: var(--tortora); }
        .nav-btn-back { background: var(--bianco); color: var(--nero); border-color: var(--nero); }
        .nav-btn-back:hover { background: var(--nero); color: var(--bianco); }
        .nav-btn-logout { background: var(--bianco); color: var(--rosso); border-color: var(--rosso); }
        .nav-btn-logout:hover { background: var(--rosso); color: var(--bianco); }
        .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: 1.5px solid;
        }
        .sync-dot { width: 10px; height: 10px; border-radius: 50%; position: relative; flex-shrink: 0; }
        .sync-dot::after { content: 'S'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 7px; font-weight: 900; color: var(--bianco); }
        .sync-online { background: var(--verde-chiaro); color: #1E8449; border-color: var(--verde); }
        .sync-online .sync-dot { background: var(--verde); animation: pulse-verde 2s infinite; }
        .sync-warning { background: var(--arancione-chiaro); color: #9C640C; border-color: var(--arancione); }
        .sync-warning .sync-dot { background: var(--arancione); animation: pulse-arancione 1.5s infinite; }
        .sync-offline { background: var(--rosso-chiaro); color: #922B21; border-color: var(--rosso); }
        .sync-offline .sync-dot { background: var(--rosso); animation: pulse-rosso 1s infinite; }
        @keyframes pulse-verde { 0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(39, 174, 96, 0); } 100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); } }
        @keyframes pulse-arancione { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes pulse-rosso { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.2); } }
        
        /* CONTENUTO */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        .welcome-card { background: var(--bianco); border: 2px solid var(--tortora); border-radius: var(--radius); padding: 25px 30px; margin-bottom: 25px; box-shadow: var(--ombra); }
        .welcome-card h2 { font-size: 20px; color: var(--nero); margin-bottom: 8px; }
        .welcome-card p { color: var(--tortora); font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bianco); border: 2px solid var(--tortora-chiaro); border-radius: var(--radius); padding: 25px; text-align: center; box-shadow: var(--ombra); transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--ombra-forte); }
        .stat-card .number { font-size: 36px; font-weight: 700; color: var(--nero); margin-bottom: 8px; }
        .stat-card .label { font-size: 12px; color: var(--tortora); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .stat-card.verde { border-left: 5px solid var(--verde); }
        .stat-card.arancione { border-left: 5px solid var(--arancione); }
        .stat-card.rosso { border-left: 5px solid var(--rosso); }
        .section-title { font-size: 18px; color: var(--nero); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--tortora); display: flex; align-items: center; gap: 10px; }
        .palestre-list { background: var(--bianco); border: 2px solid var(--tortora); border-radius: var(--radius); padding: 20px; box-shadow: var(--ombra); }
        .palestra-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 15px; border-bottom: 1px solid var(--tortora-chiaro); transition: background 0.2s; flex-wrap: wrap; gap: 12px; }
        .palestra-item:last-child { border-bottom: none; }
        .palestra-item:hover { background: var(--tortora-chiarissimo); }
        .palestra-info { flex: 1; min-width: 200px; }
        .palestra-info .name { font-size: 16px; color: var(--nero); font-weight: 600; margin-bottom: 4px; }
        .palestra-info .details { font-size: 13px; color: var(--tortora); }
        .status-indicator { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-verde { background: var(--verde-chiaro); color: #1E8449; border: 1px solid var(--verde); }
        .status-arancione { background: var(--arancione-chiaro); color: #9C640C; border: 1px solid var(--arancione); animation: pulse 2s infinite; }
        .status-rosso { background: var(--rosso-chiaro); color: #922B21; border: 1px solid var(--rosso); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-verde { background: var(--verde); }
        .dot-arancione { background: var(--arancione); }
        .dot-rosso { background: var(--rosso); }
        .palestra-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn-action { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .btn-attiva { background: var(--verde); color: var(--bianco); }
        .btn-attiva:hover { background: #1E8449; }
        .btn-spegni { background: var(--rosso); color: var(--bianco); }
        .btn-spegni:hover { background: #922B21; }
        .btn-offerte { background: var(--tortora); color: var(--bianco); }
        .btn-offerte:hover { background: var(--nero); }
        .countdown { font-size: 12px; font-weight: 600; margin-top: 4px; }
        .countdown-verde { color: var(--verde); }
        .countdown-arancione { color: var(--arancione); }
        .countdown-rosso { color: var(--rosso); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--tortora); }
        .empty-state .icon { font-size: 48px; margin-bottom: 15px; }
        .alert-banner { background: var(--arancione-chiaro); border: 2px solid var(--arancione); border-radius: var(--radius-sm); padding: 15px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-size: 14px; color: #9C640C; font-weight: 600; }
        .alert-banner.rosso { background: var(--rosso-chiaro); border-color: var(--rosso); color: #922B21; }
        .alert-banner .icon { font-size: 20px; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: var(--nero); color: var(--bianco); padding: 16px 24px; border-radius: var(--radius-sm); box-shadow: var(--ombra-forte); font-size: 14px; font-weight: 500; z-index: 1000; opacity: 0; transform: translateY(20px); transition: all 0.3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 15px; padding: 20px; }
            .palestra-item { flex-direction: column; align-items: flex-start; gap: 12px; }
            .palestra-actions { width: 100%; justify-content: flex-end; }
            .status-indicator { margin-right: 0; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- HEADER UNIVERSALE -->
    <div class="main-header">
        <div class="header-left">
            <div class="header-title">
                <h1>AppCenterStudioGIM</h1>
                <p>Dashboard Fornitore</p>
            </div>
        </div>
        <div class="header-nav">
            <a href="index.html" class="nav-btn nav-btn-home">🏠 Home</a>
            <button class="nav-btn nav-btn-back" onclick="tornaIndietro()">← Indietro</button>
            <button class="nav-btn nav-btn-logout" onclick="esci()">🚪 Esci</button>
            <div class="sync-status sync-online" id="syncStatus" onclick="forzaSync()">
                <span class="sync-dot"></span>
                <span id="syncLabel">Sync OK</span>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="welcome-card">
            <h2>Benvenuto, AppCenterStudioGIM</h2>
            <p>Dashboard di gestione fornitori - Gestione Palestre</p>
        </div>
        
        <div id="alertContainer"></div>
        
        <div class="stats-grid">
            <div class="stat-card verde">
                <div class="number" id="statAttive">0</div>
                <div class="label">Palestre Attive</div>
            </div>
            <div class="stat-card arancione">
                <div class="number" id="statInScadenza">0</div>
                <div class="label">In Scadenza (30gg)</div>
            </div>
            <div class="stat-card rosso">
                <div class="number" id="statScadute">0</div>
                <div class="label">Scadute</div>
            </div>
            <div class="stat-card">
                <div class="number" id="statTotale">0</div>
                <div class="label">Totale Palestre</div>
            </div>
        </div>
        
        <h3 class="section-title">🏋️ Stato Palestre</h3>
        <div class="palestre-list" id="palestreList">
            <div class="empty-state">
                <div class="icon">🏋️</div>
                <div>Nessuna palestra registrata</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    const TRIAL_DAYS = 30;
    const ALERT_DAYS = 30;
    let palestre = JSON.parse(localStorage.getItem('palestre') || '[]');
    let syncState = 'online';
    let hasUnsavedChanges = false;
    
    function init() {
        aggiornaStati();
        renderStats();
        renderAlerts();
        renderPalestre();
        aggiornaSyncStatus('online', 'Sync OK');
    }
    
    function esci() {
        if (hasUnsavedChanges && !confirm('Hai modifiche non salvate. Uscire comunque?')) return;
        if (confirm('Sei sicuro di voler uscire?')) window.location.href = 'index.html';
    }
    
    function tornaIndietro() {
        if (hasUnsavedChanges && !confirm('Hai modifiche non salvate. Tornare indietro comunque?')) return;
        if (window.history.length > 1) window.history.back();
        else window.location.href = 'index.html';
    }
    
    function aggiornaSyncStatus(stato, messaggio) {
        const syncEl = document.getElementById('syncStatus');
        const syncLabel = document.getElementById('syncLabel');
        syncEl.className = 'sync-status';
        if (stato === 'online') { syncEl.classList.add('sync-online'); syncLabel.textContent = messaggio || 'Sync OK'; }
        else if (stato === 'warning') { syncEl.classList.add('sync-warning'); syncLabel.textContent = messaggio || 'Modifiche non salvate'; }
        else if (stato === 'offline') { syncEl.classList.add('sync-offline'); syncLabel.textContent = messaggio || 'Errore sync'; }
        syncState = stato;
    }
    
    function forzaSync() {
        if (syncState === 'online') { showToast('✅ Dati già sincronizzati'); return; }
        try {
            localStorage.setItem('palestre', JSON.stringify(palestre));
            aggiornaSyncStatus('online', 'Sync OK');
            hasUnsavedChanges = false;
            showToast('✅ Sincronizzazione completata!');
        } catch (e) {
            aggiornaSyncStatus('offline', 'Errore sync');
            showToast('❌ Errore durante la sincronizzazione');
        }
    }
    
    function aggiornaStati() {
        const oggi = new Date();
        palestre.forEach(palestra => {
            if (!palestra.stato) palestra.stato = 'prova';
            const scadenza = new Date(palestra.dataScadenza);
            const giorniRimanenti = Math.ceil((scadenza - oggi) / (1000 * 60 * 60 * 24));
            if (palestra.stato === 'attiva') { palestra.giorniRimanenti = giorniRimanenti; }
            else if (giorniRimanenti < 0) { palestra.stato = 'scaduta'; palestra.giorniRimanenti = giorniRimanenti; }
            else { palestra.stato = 'prova'; palestra.giorniRimanenti = giorniRimanenti; }
        });
        savePalestre();
    }
    
    function renderStats() {
        const attive = palestre.filter(p => p.stato === 'attiva').length;
        const inScadenza = palestre.filter(p => p.stato === 'prova' && p.giorniRimanenti <= ALERT_DAYS && p.giorniRimanenti >= 0).length;
        const scadute = palestre.filter(p => p.stato === 'scaduta').length;
        document.getElementById('statAttive').textContent = attive;
        document.getElementById('statInScadenza').textContent = inScadenza;
        document.getElementById('statScadute').textContent = scadute;
        document.getElementById('statTotale').textContent = palestre.length;
    }
    
    function renderAlerts() {
        const container = document.getElementById('alertContainer');
        const inScadenza = palestre.filter(p => p.stato === 'prova' && p.giorniRimanenti <= ALERT_DAYS && p.giorniRimanenti >= 0);
        const scadute = palestre.filter(p => p.stato === 'scaduta');
        let html = '';
        if (scadute.length > 0) html += `<div class="alert-banner rosso"><span class="icon">🚨</span><span><strong>${scadute.length}</strong> palestr${scadute.length === 1 ? 'a è' : 'e sono'} SCADUT${scadute.length === 1 ? 'A' : 'E'}! Invia subito il rinnovo.</span></div>`;
        if (inScadenza.length > 0) html += `<div class="alert-banner"><span class="icon">⚠️</span><span><strong>${inScadenza.length}</strong> palestr${inScadenza.length === 1 ? 'a sta' : 'e stanno'} per scadere entro 30 giorni. Invia l'offerta di rinnovo!</span></div>`;
        container.innerHTML = html;
    }
    
    function renderPalestre() {
        const container = document.getElementById('palestreList');
        if (palestre.length === 0) {
            container.innerHTML = `<div class="empty-state"><div class="icon">🏋️</div><div>Nessuna palestra registrata. Vai su "Offerte" per aggiungerne una.</div></div>`;
            return;
        }
        const palestreOrdinate = [...palestre].sort((a, b) => {
            if (a.stato === 'scaduta' && b.stato !== 'scaduta') return -1;
            if (a.stato !== 'scaduta' && b.stato === 'scaduta') return 1;
            if (a.stato === 'prova' && b.stato === 'attiva') return -1;
            if (a.stato === 'attiva' && b.stato === 'prova') return 1;
            return (a.giorniRimanenti || 0) - (b.giorniRimanenti || 0);
        });
        let html = '';
        palestreOrdinate.forEach(palestra => {
            let statusClass = 'status-verde', dotClass = 'dot-verde', statusText = 'Attiva', countdownClass = 'countdown-verde', countdownText = '', btnToggleClass = 'btn-spegni', btnToggleText = '️ Spegni';
            if (palestra.stato === 'scaduta') { statusClass = 'status-rosso'; dotClass = 'dot-rosso'; statusText = 'Scaduta'; countdownClass = 'countdown-rosso'; countdownText = `Scaduta da ${Math.abs(palestra.giorniRimanenti)} giorni`; btnToggleClass = 'btn-attiva'; btnToggleText = '✓ Riattiva'; }
            else if (palestra.stato === 'prova' && palestra.giorniRimanenti <= ALERT_DAYS) { statusClass = 'status-arancione'; dotClass = 'dot-arancione'; statusText = 'In Scadenza'; countdownClass = 'countdown-arancione'; countdownText = `Scade tra ${palestra.giorniRimanenti} giorni`; btnToggleClass = 'btn-attiva'; btnToggleText = '✓ Attiva'; }
            else if (palestra.stato === 'prova') { statusClass = 'status-verde'; dotClass = 'dot-verde'; statusText = 'In Prova'; countdownClass = 'countdown-verde'; countdownText = `Prova: ${palestra.giorniRimanenti} giorni rimanenti`; }
            else { countdownText = 'Abbonamento attivo'; }
            const scadenza = new Date(palestra.dataScadenza).toLocaleDateString('it-IT');
            html += `<div class="palestra-item">
                <div class="palestra-info">
                    <div class="name">${palestra.nome}</div>
                    <div class="details">${palestra.referente || 'Nessun referente'} • ${palestra.citta || 'Città non specificata'}<br>📞 ${palestra.telefono} • Scadenza: ${scadenza}</div>
                    <div class="countdown ${countdownClass}">${countdownText}</div>
                </div>
                <div class="status-indicator ${statusClass}"><span class="status-dot ${dotClass}"></span>${statusText}</div>
                <div class="palestra-actions">
                    <a href="offerte.html" class="btn-action btn-offerte"> Offerte</a>
                    <button class="btn-action ${btnToggleClass}" onclick="togglePalestra(${palestra.id})">${btnToggleText}</button>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }
    
    function togglePalestra(id) {
        const palestra = palestre.find(p => p.id === id);
        if (!palestra) return;
        if (palestra.stato === 'attiva') { palestra.stato = 'prova'; showToast(`⏸️ ${palestra.nome} disattivata`); }
        else { palestra.stato = 'attiva'; const oggi = new Date(); const nuovaScadenza = new Date(oggi); nuovaScadenza.setDate(nuovaScadenza.getDate() + 30); palestra.dataScadenza = nuovaScadenza.toISOString(); showToast(`✅ ${palestra.nome} attivata per 30 giorni`); }
        savePalestre();
        aggiornaStati();
        renderStats();
        renderAlerts();
        renderPalestre();
        aggiornaSyncStatus('online', 'Sync OK');
        hasUnsavedChanges = false;
    }
    
    function savePalestre() { localStorage.setItem('palestre', JSON.stringify(palestre)); }
    function showToast(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); }
    
    init();
    </script>
</body>
</html>
