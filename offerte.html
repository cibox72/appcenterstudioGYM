<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Offerte e Palestre - AppCenterStudioGYM</title>
    <style>
        :root { --nero: #1A1A1A; --tortora: #9C928A; --tortora-scuro: #7A716A; --tortora-chiaro: #E8E3DE; --tortora-chiarissimo: #F5F2EF; --bianco: #FFFFFF; --verde: #27AE60; --rosso: #E74C3C; --blu: #3498DB; --ombra: 0 2px 12px rgba(0,0,0,0.08); --radius: 12px; --radius-sm: 8px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: var(--nero); min-height: 100vh; }
        .top-header { background: var(--tortora); color: var(--bianco); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--ombra); position: sticky; top: 0; z-index: 100; }
        .top-header h1 { font-size: 20px; font-weight: 700; }
        .btn-logout { background: rgba(255,255,255,0.2); color: var(--bianco); border: 1px solid rgba(255,255,255,0.4); padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .section-header h2 { font-size: 22px; }
        .btn { padding: 10px 18px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
        .btn-primary { background: var(--tortora); color: var(--bianco); }
        .btn-primary:hover { background: var(--nero); }
        .btn-danger { background: var(--rosso); color: var(--bianco); }
        .btn-danger:hover { opacity: 0.9; }
        .btn-sm { padding: 7px 12px; font-size: 12px; }
        .palestre-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .palestra-card { background: var(--bianco); border-radius: var(--radius); padding: 20px; box-shadow: var(--ombra); border: 1px solid #e0e0e0; }
        .palestra-card h3 { font-size: 18px; margin-bottom: 8px; }
        .palestra-card .info { font-size: 13px; color: var(--tortora-scuro); margin-bottom: 4px; }
        .palestra-card .info strong { color: var(--nero); }
        .palestra-card .actions { margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--tortora-chiaro); display: flex; gap: 8px; flex-wrap: wrap; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--tortora); background: var(--bianco); border-radius: var(--radius); border: 2px dashed var(--tortora-chiaro); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bianco); border-radius: var(--radius); padding: 30px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--tortora-chiaro); }
        .modal-title { font-size: 20px; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--tortora); }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 12px; font-weight: 700; color: var(--tortora-scuro); text-transform: uppercase; letter-spacing: 0.8px; }
        .form-group input, .form-group select { padding: 10px 12px; border: 1.5px solid var(--tortora-chiaro); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--tortora); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: var(--nero); color: var(--bianco); padding: 14px 22px; border-radius: var(--radius-sm); z-index: 2000; opacity: 0; transform: translateY(20px); transition: all 0.3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .loading { text-align: center; padding: 40px; color: var(--tortora); }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .palestre-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="top-header">
        <h1>AppCenterStudioGYM - Pannello Fornitore</h1>
        <a href="index.html" class="btn-logout" onclick="localStorage.removeItem('currentUser')">Logout</a>
    </div>

    <div class="container">
        <div class="section-header">
            <div>
                <h2>Gestione Palestre</h2>
                <div style="font-size: 13px; color: var(--tortora); margin-top: 4px;">Elenco delle palestre registrate e relative credenziali</div>
            </div>
            <button class="btn btn-primary" onclick="location.reload()">🔄 Aggiorna Elenco</button>
        </div>

        <div id="palestreContainer">
            <div class="loading">Caricamento palestre...</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    const API_URL = 'https://ancient-fire-7347.mairaluigi-b2f.workers.dev';

    function init() {
        const userStr = localStorage.getItem('currentUser');
        if (!userStr) { window.location.href = 'index.html'; return; }
        const user = JSON.parse(userStr);
        if (user.ruolo !== 'fornitore') {
            showToast('⚠️ Accesso non autorizzato');
            setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            return;
        }
        caricaPalestre();
    }

    async function caricaPalestre() {
        const container = document.getElementById('palestreContainer');
        try {
            const res = await fetch(`${API_URL}/api/palestre`);
            const palestre = await res.json();
            
            if (palestre.length === 0) {
                container.innerHTML = '<div class="empty-state"><div style="font-size: 48px; margin-bottom: 15px; opacity: 0.5;">🏢</div><div style="font-size: 15px; margin-bottom: 20px;">Nessuna palestra registrata</div></div>';
                return;
            }

            let html = '<div class="palestre-grid">';
            palestre.forEach(p => {
                html += `
                <div class="palestra-card">
                    <h3>${p.nome || 'Palestra senza nome'}</h3>
                    <div class="info"><strong>ID Univoco:</strong> <span style="font-family: monospace; background: var(--tortora-chiarissimo); padding: 2px 6px; border-radius: 4px;">${p.username || '-'}</span></div>
                    <div class="info"><strong>Città:</strong> ${p.citta || '-'}</div>
                    <div class="info"><strong>Stato:</strong> ${p.stato || 'prova'}</div>
                    <div class="info"><strong>Scadenza:</strong> ${p.data_scadenza ? new Date(p.data_scadenza).toLocaleDateString('it-IT') : '-'}</div>
                    <div class="actions">
                        <button class="btn btn-sm btn-danger" onclick="eliminaPalestra(${p.id}, '${(p.nome || 'Questa palestra').replace(/'/g, "\\'")}')">🗑️ Elimina Palestra</button>
                    </div>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        } catch (error) {
            console.error('Errore:', error);
            container.innerHTML = '<div class="empty-state">Errore di caricamento. Ricarica la pagina.</div>';
        }
    }

    async function eliminaPalestra(id, nome) {
        if (!confirm(`Sei sicuro di voler ELIMINARE definitivamente "${nome}"?\n\nQuesta azione cancellerà la palestra e le sue credenziali di accesso.`)) return;
        
        try {
            const res = await fetch(`${API_URL}/api/palestre/${id}`, { method: 'DELETE' });
            const result = await res.json();
            
            if (result.success) {
                showToast('✅ Palestra eliminata con successo');
                caricaPalestre();
            } else {
                showToast('❌ Errore: ' + (result.error || 'Impossibile eliminare'));
            }
        } catch (error) {
            console.error('Errore:', error);
            showToast('❌ Errore di connessione');
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    init();
    </script>
</body>
</html>
